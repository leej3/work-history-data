name: Maintain project statuses

on:
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * *"
    - cron: "0 11 * * 0"

permissions:
  contents: read

concurrency:
  group: project-status
  cancel-in-progress: false

jobs:
  Maintain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        env:
          ARCHIVE_DONE: ${{ github.event.schedule == '0 11 * * 0' }}
        with:
          github-token: ${{ secrets.GH_PAT }}
          script: |
            const maintain = require('./.github/scripts/project-status.cjs');
            await maintain({ github, core });
